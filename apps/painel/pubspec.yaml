name: ya_painel
description: "YA Painel - backoffice para a plataforma de mobilidade YA"
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^17.2.3

  # Forms
  reactive_forms: ^18.2.2

  # Tabelas
  trina_grid: ^2.2.1

  # Charts
  fl_chart: ^1.2.0
  syncfusion_flutter_gauges: ^33.2.4

  # Mapas
  flutter_map: ^8.3.0
  flutter_map_marker_cluster: ^8.2.2
  flutter_map_animations: ^0.10.0
  latlong2: ^0.9.1

  # Ícones
  lucide_icons_flutter: ^3.0.0

  # Datas / i18n
  intl: ^0.20.2
  timeago: ^3.7.0
  shared_preferences: ^2.3.0
  file_picker: ^8.1.4

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_database: ^12.3.0
  firebase_storage: ^13.3.0
  cloud_functions: ^6.2.0

  # Utilities
  collection: ^1.18.0
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  # Tipografia (carrega Newsreader, Inter, JetBrains Mono via Google Fonts)
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  generate: true
  uses-material-design: true

  # Fonts são carregadas via google_fonts package em runtime,
  # não é necessário incluir aqui a menos que queiras bundle local
  # assets:
  #   - assets/images/
