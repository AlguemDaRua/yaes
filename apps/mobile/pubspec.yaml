name: limousineexecutive
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1 # For using Google Fonts
  provider: ^6.1.5 # For state management
  image_picker: ^1.0.7 # For picking images from the gallery or camera
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  cupertino_icons: ^1.0.8
  pin_code_fields: ^8.0.1
  intl_phone_field: ^3.2.0
  flutter_map: ^8.2.1
  flutter_map_animations: ^0.9.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  flutter_polyline_points: ^2.0.0
  fluttertoast: ^8.2.1
  flutter_rating_bar: ^4.0.0
  http: ^1.5.0
  easy_debounce: ^2.0.2
  audioplayers: ^5.2.1
  slide_to_act: ^2.0.2
  animated_text_kit: ^4.2.2
  date_picker_textfield: ^1.0.4
  dropdown_flutter: 1.0.1
  fl_chart: ^0.65.0
  intl: ^0.18.1
  bottom_picker: ^4.1.1
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  vibration: ^3.1.5 #para vibrar o celular
  url_launcher: ^6.2.5 #para fazer acoes do telefone na app
  firebase_core: ^3.6.0
  firebase_database: ^11.3.10
  firebase_auth: ^5.3.0
  firebase_storage: ^12.3.0
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+5
  firebase_crashlytics: ^4.1.3
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.6
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4
  build_runner: ^2.4.13

# Icone da App
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app-icon.png"

flutter_native_splash:
  android: true
  ios: true
  color: "#FFFFFF"
  # Configuração para Android <12 e iOS
  image: assets/images/app-icon.png # ícone central
  icon_background_color: "#FFFFFF" # cor sólida atrás do ícone
  # Configuração específica para Android 12+
  android_12:
    color: "#FFFFFF"
    image: "assets/images/ya-gold.png" # ícone central no splash animadocor atrás do ícone (usa a base do gradiente)
    icon_background_color: "#FFFFFF" # cor sólida atrás do ícone

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/cars/
    - assets/fonts/
    - assets/sounds/

  fonts:
    - family: Gagalin
      fonts:
        - asset: assets/fonts/Gagalin.ttf
